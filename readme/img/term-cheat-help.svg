<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 606" width="820" height="606" role="img" aria-label="kitty - cheat help">
<rect width="820" height="606" rx="10" fill="#011627" stroke="#213b5d"/>
<path d="M0 10a10 10 0 0 1 10-10h800a10 10 0 0 1 10 10v26H0z" fill="#0b2942"/>
<circle cx="20" cy="18" r="6" fill="#ef5350"/>
<circle cx="40" cy="18" r="6" fill="#ffcb6b"/>
<circle cx="60" cy="18" r="6" fill="#22da6e"/>
<text x="410.0" y="23" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8093a5">kitty - cheat help</text>
<g font-family="'DejaVuSansM Nerd Font Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="20" y="58" fill="#d6deeb"><tspan fill="#22da6e">❯ </tspan><tspan fill="#7fdbca">cheat help</tspan></text>
<text x="20" y="100" fill="#d6deeb"><tspan fill="#213b5d"># </tspan><tspan fill="#6285c9">help</tspan></text>
<text x="20" y="142" fill="#d6deeb"><tspan fill="#213b5d">&gt; </tspan><tspan fill="#7e8e9e">The index of our own sheets. `cheat [name]` shows any sheet.</tspan></text>
<text x="20" y="184" fill="#d6deeb"><tspan fill="#213b5d"># </tspan><tspan fill="#6285c9">Getting started</tspan></text>
<text x="20" y="226" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`cheat setup`, `cheat keys`       </tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">how the config fits together; every key binding</tspan></text>
<text x="20" y="247" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`cheat troubleshoot`              </tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">fixes for problems seen before</tspan></text>
<text x="20" y="268" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`cheat`, `cheat functions`        </tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">list every sheet; every zsh-config command</tspan></text>
<text x="20" y="289" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`ctrl+r`                          </tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">fuzzy-search history for a command you ran</tspan></text>
<text x="20" y="310" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`j [name]`                        </tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">jump to a folder: an alias, or z's best match</tspan></text>
<text x="20" y="352" fill="#d6deeb"><tspan fill="#213b5d"># </tspan><tspan fill="#6285c9">Everyday</tspan></text>
<text x="20" y="394" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`tab`                             </tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">completion opens in fzf; type to filter</tspan></text>
<text x="20" y="415" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`j alias add [name] .`            </tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">bookmark this folder, then `j [name]`</tspan></text>
<text x="20" y="436" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`update`                          </tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">keep the whole machine current</tspan></text>
<text x="20" y="478" fill="#d6deeb"><tspan fill="#213b5d"># </tspan><tspan fill="#6285c9">See also</tspan></text>
<text x="20" y="520" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`cheat changes`, `cheat aliases`  </tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">what changed lately; every alias</tspan></text>
<text x="20" y="541" fill="#d6deeb"><tspan fill="#213b5d">- </tspan><tspan fill="#7fdbca">`cheat cheat`, `cheat cheat format`</tspan><tspan fill="#213b5d"> - </tspan><tspan fill="#7e8e9e">the sheet viewer; how every sheet is written</tspan></text>
</g>
<rect x="1" y="572" width="818" height="33" rx="9" fill="#0b2942"/>
<text x="20" y="593" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve" fill="#54667f">~/.custom  main  Opus  ctx 12%</text>
</svg>
