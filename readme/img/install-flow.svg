<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="install flow: ./install, install.zsh, the installers in order, then update with updaters and an error log">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#82aaff"/></marker></defs>
<rect width="1000" height="330" rx="12" fill="#011627"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#d6deeb" text-anchor="middle">
<text x="30" y="34" font-size="15" font-weight="bold" fill="#82aaff" text-anchor="start">install, once</text>
<text x="30" y="188" font-size="15" font-weight="bold" fill="#82aaff" text-anchor="start">update, whenever</text>

<g font-size="13">
<rect x="30" y="52" width="150" height="70" rx="8" fill="#0b2942" stroke="#82aaff"/><text x="105" y="80" font-family="Menlo,monospace" fill="#7fdbca">./install</text><text x="105" y="100" font-size="11" fill="#8093a5">POSIX sh bootstrap</text>
<rect x="225" y="52" width="150" height="70" rx="8" fill="#0b2942" stroke="#82aaff"/><text x="300" y="80" font-family="Menlo,monospace" fill="#7fdbca">install.zsh</text><text x="300" y="100" font-size="11" fill="#8093a5">installs zsh if missing</text>
<rect x="420" y="52" width="170" height="70" rx="8" fill="#0b2942" stroke="#82aaff"/><text x="505" y="76" font-family="Menlo,monospace" fill="#7fdbca">00-zshconfig</text><text x="505" y="94" font-size="11" fill="#8093a5">links ~/.custom, dotfiles</text><text x="505" y="109" font-size="11" fill="#8093a5">and cheat sheets</text>
<rect x="635" y="52" width="150" height="70" rx="8" fill="#0b2942" stroke="#82aaff"/><text x="710" y="76" font-family="Menlo,monospace" fill="#7fdbca">01-homebrew</text><text x="710" y="94" font-size="11" fill="#8093a5">or 02-apt-base</text><text x="710" y="109" font-size="11" fill="#8093a5">on Debian</text>
<rect x="830" y="52" width="140" height="70" rx="8" fill="#0b2942" stroke="#82aaff"/><text x="900" y="80">per-tool</text><text x="900" y="100" font-size="11" fill="#8093a5">installers, by name</text>
</g>
<g stroke="#82aaff" stroke-width="2" fill="none">
<path d="M180 87H223" marker-end="url(#a)"/><path d="M375 87H418" marker-end="url(#a)"/><path d="M590 87H633" marker-end="url(#a)"/><path d="M785 87H828" marker-end="url(#a)"/>
</g>
<text x="500" y="152" font-size="12" fill="#8093a5">a failed installer does not stop the run; problems and fixes print at the end</text>

<g font-size="13">
<rect x="30" y="208" width="150" height="70" rx="8" fill="#0b2942" stroke="#6cc4f4"/><text x="105" y="236" font-family="Menlo,monospace" fill="#7fdbca">update</text><text x="105" y="256" font-size="11" fill="#8093a5">checks this repo first</text>
<rect x="225" y="208" width="150" height="70" rx="8" fill="#0b2942" stroke="#6cc4f4"/><text x="300" y="236">self-pull</text><text x="300" y="256" font-size="11" fill="#8093a5">then restarts itself</text>
<rect x="420" y="208" width="150" height="70" rx="8" fill="#0b2942" stroke="#6cc4f4"/><text x="495" y="236">sudo once</text><text x="495" y="256" font-size="11" fill="#8093a5">kept alive for the run</text>
<rect x="615" y="208" width="190" height="70" rx="8" fill="#0b2942" stroke="#6cc4f4"/><text x="710" y="232">updaters NNN</text><text x="710" y="250" font-size="11" fill="#8093a5">in number order, 000 OS</text><text x="710" y="265" font-size="11" fill="#8093a5">to 950-projects last</text>
<rect x="850" y="208" width="120" height="70" rx="8" fill="#0b2942" stroke="#6cc4f4"/><text x="910" y="236">error log</text><text x="910" y="256" font-size="11" fill="#8093a5">reprinted at the end</text>
</g>
<g stroke="#6cc4f4" stroke-width="2" fill="none">
<path d="M180 243H223" marker-end="url(#a)"/><path d="M375 243H418" marker-end="url(#a)"/><path d="M570 243H613" marker-end="url(#a)"/><path d="M805 243H848" marker-end="url(#a)"/>
</g>
</g>
</svg>
