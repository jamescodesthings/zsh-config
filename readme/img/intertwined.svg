<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="zsh-config underneath, hub on top, with arrows between them">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#82aaff"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c792ea"/></marker>
</defs>
<rect width="900" height="520" rx="12" fill="#011627"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#d6deeb">
<!-- hub -->
<rect x="30" y="24" width="840" height="200" rx="14" fill="#0b2942" stroke="#c792ea" stroke-width="2"/>
<text x="52" y="54" font-size="20" font-weight="bold" fill="#c792ea">hub</text>
<text x="100" y="54" font-size="13" fill="#8093a5">one session steering a Claude session per repo</text>
<rect x="60" y="76" width="200" height="56" rx="8" fill="#011627" stroke="#c792ea"/>
<text x="160" y="100" font-size="14" text-anchor="middle">hub session</text>
<text x="160" y="119" font-size="11" text-anchor="middle" fill="#8093a5">front-most, routes work</text>
<rect x="330" y="76" width="130" height="56" rx="8" fill="#011627" stroke="#c792ea"/>
<text x="395" y="100" font-size="14" text-anchor="middle">child: repo A</text>
<text x="395" y="119" font-size="11" text-anchor="middle" fill="#8093a5">long-lived session</text>
<rect x="480" y="76" width="130" height="56" rx="8" fill="#011627" stroke="#c792ea"/>
<text x="545" y="100" font-size="14" text-anchor="middle">child: repo B</text>
<text x="545" y="119" font-size="11" text-anchor="middle" fill="#8093a5">long-lived session</text>
<rect x="630" y="76" width="130" height="56" rx="8" fill="#011627" stroke="#c792ea"/>
<text x="695" y="100" font-size="14" text-anchor="middle">child: repo C</text>
<text x="695" y="119" font-size="11" text-anchor="middle" fill="#8093a5">long-lived session</text>
<rect x="60" y="158" width="200" height="44" rx="8" fill="#011627" stroke="#c792ea"/>
<text x="160" y="185" font-size="14" text-anchor="middle">actions waiting on you</text>
<path d="M260 104H328" stroke="#c792ea" stroke-width="2" marker-end="url(#b)" fill="none"/>
<text x="294" y="96" font-size="11" text-anchor="middle" fill="#c792ea">fans out</text>
<path d="M395 76V62H545V76M545 62H695V76" stroke="#c792ea" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
<path d="M160 132V156" stroke="#c792ea" stroke-width="2" marker-end="url(#b)" fill="none"/>
<text x="330" y="190" font-size="12" fill="#8093a5">children edit only their own repo and report back through the hub</text>

<!-- zsh-config -->
<rect x="30" y="296" width="840" height="200" rx="14" fill="#0b2942" stroke="#82aaff" stroke-width="2"/>
<text x="52" y="326" font-size="20" font-weight="bold" fill="#82aaff">zsh-config</text>
<text x="172" y="326" font-size="13" fill="#8093a5">the shell every session runs in</text>
<g font-size="13" text-anchor="middle">
<rect x="50" y="346" width="150" height="56" rx="8" fill="#011627" stroke="#82aaff"/><text x="125" y="370">shell</text><text x="125" y="388" font-size="11" fill="#8093a5">zsh, prompt, functions</text>
<rect x="215" y="346" width="150" height="56" rx="8" fill="#011627" stroke="#82aaff"/><text x="290" y="370">cheat</text><text x="290" y="388" font-size="11" fill="#8093a5">sheets and renderer</text>
<rect x="380" y="346" width="150" height="56" rx="8" fill="#011627" stroke="#82aaff"/><text x="455" y="370">CLI helpers</text><text x="455" y="388" font-size="11" fill="#8093a5">say, col, progress</text>
<rect x="545" y="346" width="150" height="56" rx="8" fill="#011627" stroke="#82aaff"/><text x="620" y="370">key, wipcrypt</text><text x="620" y="388" font-size="11" fill="#8093a5">keys and ciphertext</text>
<rect x="710" y="346" width="140" height="56" rx="8" fill="#011627" stroke="#82aaff"/><text x="780" y="370">projects/</text><text x="780" y="388" font-size="11" fill="#8093a5">drop-in stubs</text>
<rect x="50" y="424" width="320" height="52" rx="8" fill="#011627" stroke="#82aaff"/><text x="210" y="446">installers</text><text x="210" y="464" font-size="11" fill="#8093a5">./install, then 00-zshconfig, brew or apt, per tool</text>
<rect x="400" y="424" width="450" height="52" rx="8" fill="#011627" stroke="#82aaff"/><text x="625" y="446">update</text><text x="625" y="464" font-size="11" fill="#8093a5">self-pull, updaters NNN in order, 950-projects last</text>
</g>

<!-- arrows between the layers -->
<g font-size="11.5">
<path d="M780 296V240H760" stroke="#82aaff" stroke-width="2" fill="none"/>
<path d="M780 240V210" stroke="none"/>
<path d="M800 340V232" stroke="#c792ea" stroke-width="2" marker-start="url(#b)" fill="none"/>
<text x="808" y="276" fill="#c792ea">hub writes stubs</text>
<text x="808" y="291" fill="#c792ea">into projects/</text>
<path d="M455 340V232" stroke="#c792ea" stroke-width="2" marker-start="url(#b)" fill="none" stroke-dasharray="6 4"/>
<path d="M290 340V240H395" stroke="#c792ea" stroke-width="2" marker-start="url(#b)" fill="none" stroke-dasharray="6 4"/>
<path d="M620 340V232" stroke="#c792ea" stroke-width="2" marker-start="url(#b)" fill="none" stroke-dasharray="6 4"/>
<text x="470" y="262" fill="#c792ea">hub calls the helpers,</text>
<text x="470" y="277" fill="#c792ea">cheat, key and wipcrypt</text>
<path d="M850 450H872V260" stroke="none"/>
<path d="M625 424V412" stroke="none"/>
<path d="M60 424V412M60 412H40V232H60" stroke="#82aaff" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="46" y="318" font-size="11" fill="#82aaff" transform="rotate(-90 46 318)" text-anchor="middle">update runs 950-projects, which updates hub</text>
</g>
</g>
</svg>
