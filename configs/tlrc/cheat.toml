# cheat's own tlrc settings, passed with --config by functions/cheat when it
# renders a local sheet. tldr's own pages and the user's tlrc config are not
# affected. Compact output keeps a top sheet within half a kitty window;
# section headings render as titles (bold), descriptions italic, commands in
# cyan and examples in green. Generated from `tldr --gen-config` (tlrc 1.13).
# Colour off: NO_COLOR=1 or `tldr --color never`.

[cache]
dir = "~/Library/Caches/tlrc"
mirror = "https://github.com/tldr-pages/tldr/releases/latest/download"
auto_update = true
defer_auto_update = false
max_age = 336
languages = []

[output]
show_title = true
platform_title = false
show_hyphens = false
edit_link = false
example_prefix = "- "
line_length = 0
compact = true
option_style = "long"
raw_markdown = false

[indent]
title = 2
description = 2
bullet = 2
example = 4

[style.title]
color = "blue"
background = "default"
bold = true
underline = false
italic = false
dim = false
strikethrough = false

[style.description]
color = "default"
background = "default"
bold = false
underline = false
italic = true
dim = false
strikethrough = false

[style.bullet]
color = "default"
background = "default"
bold = false
underline = false
italic = false
dim = false
strikethrough = false

[style.example]
color = "green"
background = "default"
bold = false
underline = false
italic = false
dim = false
strikethrough = false

[style.url]
color = "red"
background = "default"
bold = false
underline = false
italic = true
dim = false
strikethrough = false

[style.inline_code]
color = "cyan"
background = "default"
bold = false
underline = false
italic = false
dim = false
strikethrough = false

[style.placeholder]
color = "red"
background = "default"
bold = false
underline = false
italic = true
dim = false
strikethrough = false
