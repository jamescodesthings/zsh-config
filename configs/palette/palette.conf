# The one palette for every CLI James runs: zsh-config's helpers (`col`,
# `say`, the cheat renderer) read it, and so do tools in other languages.
#
# Format, for any reader:
#   key = value        one per line; blank lines and lines starting with #
#                      are ignored, and so is anything after the value
#                      (a value never holds a space)
#   value is one of:   #rrggbb
#                      another key            (an alias)
#                      key-NN                 NN per cent of that colour laid
#                                             over `background` (0 to 100)
# A key's value is resolved through aliases until it is a hex, and an alias
# loop is an error. ~/.config/zsh-config/palette.conf, same format, is read
# after this file and wins per key.
#
# The hues are tuned for kitty's Night Owl theme, whose background this is.

background = #011627

# Hues: every one can be used as `name` or `name-NN` (5, 10, 25, 50, 60, 75,
# 80, 90 are the steps the sheets use; any 0 to 100 works).
red     = #ef5350
orange  = #f78c6c
yellow  = #ffcb6b
lime    = #addb67
green   = #22da6e
teal    = #21c7a8
cyan    = #7fdbca
sky     = #6cc4f4
blue    = #82aaff
indigo  = #9a8cf2
purple  = #c792ea
magenta = #f07dd2
pink    = #ff8fb1
grey    = #a7b6c6
white   = #e6edf7

# Roles: what a colour means. Change a line here and every tool follows.
cmd       = cyan        # the command you type
tool      = cyan-50     # the tool name before it, same hue dimmed
target    = teal        # [target|here]
flag      = magenta     # [-v|--verbose]
num       = orange      # counts, ids, durations
heading   = blue-75     # section titles
marker    = blue-25     # the # - > markers in a sheet
prose     = grey-75     # explanations
dim       = grey-50     # paths, hints
ok        = green       # done
info      = sky         # neutral notes
warn      = yellow-90   # warnings
err       = red         # failures
tag-cmd   = indigo-75   # log list: our command's log
tag-child = pink-75     # log list: a child command's log
