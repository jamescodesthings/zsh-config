# BEGIN_KITTY_THEME
# Solarized Dark Higher Contrast
include current-theme.conf
# END_KITTY_THEME

# Appearance


## Font
font_family      DejaVuSansM Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

## Background
background_opacity 0.92

## Windows
window_margin_width 1

window_border_width 1pt
active_border_color #44ffff
single_window_margin_width 0

## Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{fmt.fg.c2c2c2}{index}: {title}"

active_tab_title_template "{fmt.fg._fff}{index}: {title}"
active_tab_foreground #fff
active_tab_font_style bold-italic
active_tab_background #004848

inactive_tab_foreground #c2c2c2
inactive_tab_background #002727

## Multiple Windows
# The layout list is per OS, in os.macos.conf and os.linux.conf.

## Cursor
cursor_shape block
cursor_shape_unfocused hollow
cursor_trail 10
cursor_trail_color #4dff44

## URLs
detect_urls yes
url_style straight
open_url_with default


# Behaviour

## Term Variable
term xterm-kitty

## Shell Integration
shell_integration no-cursor

# Auto Reload Config
auto_reload_config 0.3

## Tab Switching
tab_switch_strategy left

## Copy
# Selecting text copies it to the clipboard. "yes" would name a private
# kitty buffer instead, which nothing else can paste from.
copy_on_select clipboard

## Paste
strip_trailing_spaces smart

## Scrollback
scrollback_lines 5000

## Terminal bell
enable_audio_bell noclear


# Keys that behave the same on every OS
## shift+enter as a distinct key, for Claude Code
map shift+enter send_text all \x1b[13;2u

# Remote control over a private socket, so local tools (readerr's "speak this
# window") can ask kitty which pane is focused and read its text. socket-only
# means no escape-sequence control from programs running inside kitty.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# Keys and settings for this OS: os.macos.conf or os.linux.conf. kitty sets
# KITTY_OS itself, for include lines only.
include os.${KITTY_OS}.conf

# Overrides for this box
include overrides.conf
