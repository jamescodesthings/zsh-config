# macOS keys and settings, included from kitty.conf. cmd does what ctrl does
# on Linux, following iTerm where it has a convention. kitty's own macOS
# defaults stay as they are: cmd+c and cmd+v copy and paste, cmd+k clears the
# screen, cmd+f searches the scrollback (the selection, if there is one), cmd+1..9 pick a tab, cmd+shift+[ and ] step through tabs, cmd+q
# quits, and cmd+plus and cmd+minus change the font size.

macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# grid lays new panes out in turn: two columns, then the right column splits,
# then the left, and so on. stack is there for zooming one pane to full size.
enabled_layouts grid,stack

# OSX Overrides for Kitty
# 1. Standard App Shortcuts
map --when-focus-on title:micro cmd+s send_key ctrl+s
map --when-focus-on title:micro cmd+z send_key ctrl+z
map --when-focus-on title:micro cmd+c send_key ctrl+c
map --when-focus-on title:micro cmd+v send_key ctrl+v
map --when-focus-on title:micro cmd+x send_key ctrl+x
map --when-focus-on title:micro cmd+a send_key ctrl+a
map --when-focus-on title:micro cmd+f send_key ctrl+f
map --when-focus-on title:micro cmd+backspace send_key ctrl+k

# Global Copy (Runs everywhere EXCEPT when overridden by --when-focus-on)
map cmd+c copy_to_clipboard


## Line editing: cmd+left and cmd+right go to the start and end of the line
map cmd+left send_text all \x01
map cmd+right send_text all \x05

## Tabs
map cmd+t new_tab_with_cwd

## Panes
map cmd+enter launch --cwd=current
map cmd+w close_window
# Close the other panes in this tab, or the other tabs if this is the only pane
map cmd+shift+w kitten close_others.py
map cmd+shift+enter toggle_layout stack
map cmd+opt+p detach_window ask

## Moving between panes. ctrl+arrows is free here as long as macOS has
## "Move left/right a space" and Mission Control off ctrl+arrows.
map ctrl+up neighboring_window top
map ctrl+right neighboring_window right
map ctrl+down neighboring_window bottom
map ctrl+left neighboring_window left
map cmd+[ previous_window
map cmd+] next_window

## Moving the pane itself
map ctrl+shift+up move_window top
map ctrl+shift+right move_window right
map ctrl+shift+down move_window bottom
map ctrl+shift+left move_window left

## Expanding or shrinking the pane
map ctrl+opt+left  resize_window narrower
map ctrl+opt+right resize_window wider
map ctrl+opt+up    resize_window taller
map ctrl+opt+down  resize_window shorter

map ctrl+opt+backspace reset_window_sizes

## Command palette
map cmd+shift+a command_palette
