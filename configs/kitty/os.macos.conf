# macOS keys and settings, included from kitty.conf. cmd does what ctrl does
# on Linux, following iTerm where it has a convention. kitty's own macOS
# defaults stay as they are: cmd+c and cmd+v copy and paste, cmd+k clears the
# screen, cmd+1..9 pick a tab, cmd+shift+[ and ] step through tabs, cmd+q
# quits, and cmd+plus and cmd+minus change the font size.

macos_titlebar_color #006464
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# splits first, so cmd+d and cmd+shift+d split the current pane. stack is
# there for zooming one pane to full size.
enabled_layouts splits,grid,stack

## Line editing: cmd+left and cmd+right go to the start and end of the line
map cmd+left send_text all \x01
map cmd+right send_text all \x05

## Tabs
map cmd+t new_tab_with_cwd

## Panes
map cmd+enter launch --cwd=current
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+w close_window
map cmd+shift+enter toggle_layout stack
map cmd+opt+p detach_window ask

## Moving between panes. ctrl+arrows is free here as long as macOS has
## "Move left/right a space" and Mission Control off ctrl+arrows.
map ctrl+up neighboring_window top
map ctrl+right neighboring_window right
map ctrl+down neighboring_window bottom
map ctrl+left neighboring_window left
map cmd+[ previous_window
map cmd+] next_window

## Moving the pane itself
map ctrl+shift+up move_window top
map ctrl+shift+right move_window right
map ctrl+shift+down move_window bottom
map ctrl+shift+left move_window left

## Search the scrollback: opens it in the pager, where / searches
map cmd+f show_scrollback

## Command palette
map cmd+shift+a command_palette
